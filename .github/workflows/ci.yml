# .github/workflows/ci.yml
#
# Continuous integration pipeline for ResolveAI.
# Runs on every push to main and every pull request.
#
# Jobs:
#   lint  — code style and formatting checks
#   test  — unit and integration tests with coverage
#


name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:

  # ── Lint ────────────────────────────────────────────────────────────────────
  lint:
    name: Lint and format check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install "ruff==0.4.7"

      - name: Run ruff lint
        run: ruff check src/ tests/ evaluation/
        continue-on-error: true

      - name: Run ruff format check
        run: ruff format --check src/ tests/ evaluation/
        continue-on-error: true


  # ── Test ────────────────────────────────────────────────────────────────────
  test:
    name: Unit and integration tests
    runs-on: ubuntu-latest
    needs: lint

    # Environment variables available to all test steps
    env:
      # Application
      ENVIRONMENT: test
      LOG_FORMAT: pretty
      LOG_LEVEL: INFO

      # LLM — tests mock the LLM, no real API key needed
      LLM_PROVIDER: ollama
      OLLAMA_BASE_URL: http://localhost:11434
      OLLAMA_MODEL: llama3.2:3b
      AGENT_PROMPT_VERSION: v2
      AGENT_MAX_TOKENS: "1024"
      AGENT_TEMPERATURE: "0.1"
      AGENT_MEMORY_WINDOW: "20"
      AGENT_RETRIEVAL_TOP_K: "5"
      AGENT_LOW_CONFIDENCE_THRESHOLD: "0.4"

      # Database — use SQLite for tests (no PostgreSQL needed in CI)
      DATABASE_URL: sqlite:///./test.db

      # Vector store — mocked in tests
      CHROMA_HOST: localhost
      CHROMA_PORT: "8001"
      CHROMA_COLLECTION_NAME: insurance_kb

      # Mock CRM
      MOCK_CRM_URL: http://localhost:8002
      MOCK_CRM_API_KEY: mock-crm-secret-key

      # Integrations — empty, tools are mocked in tests
      ZENDESK_SUBDOMAIN: ""
      ZENDESK_EMAIL: ""
      ZENDESK_API_TOKEN: ""
      SLACK_WEBHOOK_URL: ""
      ELEVENLABS_API_KEY: ""
      OPENAI_API_KEY: ""

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Download spaCy model for Presidio
        run: python -m spacy download en_core_web_lg

      - name: Run unit tests
        run: pytest tests/unit/ -v --no-cov

      - name: Run integration tests
        run: pytest tests/integration/ -v --no-cov

      - name: Run full test suite with coverage
        run: |
          pytest tests/unit/ tests/integration/ \
            --cov=src \
            --cov-report=term-missing \
            --cov-report=xml

      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false
        continue-on-error: true